<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Operacional</title>
<style>
:root{--bg:#f1f5f9;--sf:#fff;--ink:#0f172a;--mu:#64748b;--ln:#cbd5e1;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--sf:#162033;--ink:#e6edf5;--mu:#9fb0c3;--ln:#2a3b4f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 16px}
h1{margin:0;font-size:1.5rem;text-align:center}
p.s{margin:-10px 0 0;color:var(--mu);text-align:center}
.btns{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:220px;border:0;border-radius:20px;color:#fff;font:inherit;font-size:1.5rem;font-weight:700;cursor:pointer;padding:24px;text-align:center;box-shadow:0 6px 18px #0003;transition:transform .12s}
.big:active{transform:scale(.97)}
.big small{font-size:.9rem;font-weight:400;opacity:.9}
.big .ic{font-size:3rem;line-height:1}
.b1{background:#0f172a;border-bottom:6px solid #10b981}
.b2{background:#1b4b8f;border-bottom:6px solid #e0a100}
.big:focus-visible{outline:3px solid #e0a100;outline-offset:3px}
#app{display:none;height:100%;flex-direction:column}
#bar{display:flex;align-items:center;gap:12px;padding:6px 10px;background:var(--sf);border-bottom:1px solid var(--ln);min-height:52px}
#back{font:inherit;font-weight:600;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
#ttl{font-weight:600}
#frames{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
</style>
</head>
<body>
<div id="home">
  <h1>Painel Operacional</h1>
  <p class="s">Escolha o que deseja abrir</p>
  <div class="btns">
    <button class="big b1" data-k="a"><span class="ic">🔄</span>Passagem de Turno<small>CDI</small></button>
    <button class="big b2" data-k="b"><span class="ic">📋</span>Informe de Pendência<small>Segundo recurso</small></button>
  </div>
</div>
<div id="app">
  <div id="bar"><button id="back" type="button">← Voltar</button><span id="ttl"></span></div>
  <div id="frames"></div>
</div>
<script>
const SRC={a:"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Passagem de Turno - Sistema Operacional<\/title>\n    <!-- Tailwind CSS CDN -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <!-- FontAwesome Icons -->\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    <!-- SheetJS (xlsx) for professional excel export -->\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n    <style>\n        body {\n            font-family: 'Inter', system-ui, -apple-system, sans-serif;\n            background-color: #f1f5f9;\n        }\n        .excel-table th, .excel-table td {\n            border: 1px solid #cbd5e1;\n        }\n        /* Linha de separação mais forte entre cada equipe/pendência */\n        .excel-table tbody tr.data-row {\n            border-bottom: 2px solid #cbd5e1;\n        }\n        .excel-table tbody tr.data-row:last-child {\n            border-bottom: 1px solid #cbd5e1;\n        }\n        .region-banner {\n            background-color: #0f172a;\n            color: #ffffff;\n            font-weight: 800;\n            text-transform: uppercase;\n            letter-spacing: 0.05em;\n            border-bottom: 3px solid #10b981 !important;\n        }\n        /* Interval color classes for selects */\n        .interval-sem {\n            background-color: #dc2626 !important; /* Vermelho */\n            color: #ffffff !important;\n            font-weight: bold;\n            text-align: center;\n        }\n        .interval-no {\n            background-color: #eab308 !important; /* Amarelo */\n            color: #1e293b !important; /* Texto escuro */\n            font-weight: bold;\n            text-align: center;\n        }\n        .interval-ja {\n            background-color: #16a34a !important; /* Verde */\n            color: #ffffff !important;\n            font-weight: bold;\n            text-align: center;\n        }\n        /* Status pendências colors */\n        .status-aberta {\n            background-color: #fee2e2 !important;\n            color: #991b1b !important;\n            border-color: #f87171 !important;\n        }\n        .status-deslocamento {\n            background-color: #fef9c3 !important;\n            color: #854d0e !important;\n            border-color: #facc15 !important;\n        }\n        .status-execucao {\n            background-color: #dcfce7 !important;\n            color: #166534 !important;\n            border-color: #4ade80 !important;\n        }\n        .status-finalizada {\n            background-color: #f1f5f9 !important;\n            color: #475569 !important;\n            border-color: #94a3b8 !important;\n        }\n    <\/style>\n<\/head>\n<body class=\"min-h-screen text-slate-800 flex flex-col\">\n\n    <!-- Header -->\n    <header class=\"bg-[#0f172a] text-white px-6 py-4 flex flex-wrap items-center justify-between shadow-md gap-4\">\n        <div class=\"flex items-center space-x-3\">\n            <div class=\"bg-emerald-600 p-2.5 rounded-xl text-white shadow\">\n                <i class=\"fa-solid fa-table-cells text-xl\"><\/i>\n            <\/div>\n            <div>\n                <h1 class=\"text-lg font-bold tracking-wide\">PASSAGEM DE TURNO OPERACIONAL<\/h1>\n                <p class=\"text-xs text-slate-400\">Painel de Monitoramento, Equipes e Ocorrências em Tempo Real<\/p>\n            <\/div>\n        <\/div>\n        <div class=\"flex flex-wrap items-center gap-3 text-sm\">\n            <div class=\"flex items-center space-x-2 bg-slate-800 px-3.5 py-2 rounded-xl border border-slate-700 shadow-inner\">\n                <i class=\"fa-regular fa-calendar-days text-emerald-400\"><\/i>\n                <span id=\"current-date-display\" class=\"font-semibold text-xs\">--/--/----<\/span>\n                <span class=\"text-slate-600\">|<\/span>\n                <i class=\"fa-regular fa-clock text-emerald-400\"><\/i>\n                <span id=\"current-time-display\" class=\"font-semibold text-xs\">--:--:--<\/span>\n            <\/div>\n            <button onclick=\"savePassagemState()\" class=\"flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition\">\n                <i class=\"fa-solid fa-floppy-disk\"><\/i>\n                <span>💾 Salvar<\/span>\n            <\/button>\n            <button onclick=\"newPassagemConfirm()\" class=\"flex items-center space-x-2 bg-amber-600 hover:bg-amber-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition\">\n                <i class=\"fa-solid fa-file-circle-plus\"><\/i>\n                <span>📋 Nova<\/span>\n            <\/button>\n            <button onclick=\"openConfigModal()\" class=\"flex items-center space-x-2 bg-slate-700 hover:bg-slate-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition\">\n                <i class=\"fa-solid fa-gear\"><\/i>\n                <span>Config / Equipes<\/span>\n            <\/button>\n            <button onclick=\"clearActivityFieldsConfirm()\" class=\"flex items-center space-x-2 bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition\">\n                <i class=\"fa-solid fa-broom\"><\/i>\n                <span>🧹 Limpar Campos<\/span>\n            <\/button>\n            <button onclick=\"openWhatsappModal()\" class=\"flex items-center space-x-2 bg-emerald-700 hover:bg-emerald-800 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition\">\n                <i class=\"fa-brands fa-whatsapp text-base\"><\/i>\n                <span>Copiar p/ WhatsApp<\/span>\n            <\/button>\n            <button onclick=\"exportToExcel()\" class=\"flex items-center space-x-2 bg-sky-600 hover:bg-sky-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition\">\n                <i class=\"fa-solid fa-file-excel\"><\/i>\n                <span>📊 Exportar Excel<\/span>\n            <\/button>\n            <button onclick=\"exportBackup()\" title=\"Baixa um arquivo .json com todos os dados (equipes, pendências, turno)\" class=\"flex items-center space-x-2 bg-slate-600 hover:bg-slate-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition\">\n                <i class=\"fa-solid fa-download\"><\/i>\n                <span>Backup<\/span>\n            <\/button>\n            <button onclick=\"document.getElementById('backup-file-input').click()\" title=\"Restaura os dados a partir de um backup .json\" class=\"flex items-center space-x-2 bg-slate-600 hover:bg-slate-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition\">\n                <i class=\"fa-solid fa-upload\"><\/i>\n                <span>Restaurar<\/span>\n            <\/button>\n            <input type=\"file\" id=\"backup-file-input\" accept=\".json,application/json\" class=\"hidden\" onchange=\"importBackup(this)\">\n        <\/div>\n    <\/header>\n\n    <main class=\"flex-1 max-w-[1700px] w-full mx-auto p-6 space-y-6\">\n\n        <!-- Metrics Dashboard Bar -->\n        <div class=\"grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4\">\n            <div class=\"bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4\">\n                <div class=\"p-3 bg-blue-50 text-blue-600 rounded-xl text-xl font-bold\"><i class=\"fa-solid fa-users\"><\/i><\/div>\n                <div>\n                    <p class=\"text-xs text-slate-500 font-semibold\">Equipes<\/p>\n                    <h3 id=\"metric-total-teams\" class=\"text-xl font-extrabold text-slate-800\">0<\/h3>\n                <\/div>\n            <\/div>\n            <div class=\"bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4\">\n                <div class=\"p-3 bg-red-50 text-red-600 rounded-xl text-xl font-bold\"><i class=\"fa-solid fa-triangle-exclamation\"><\/i><\/div>\n                <div>\n                    <p class=\"text-xs text-slate-500 font-semibold\">Sem Intervalo<\/p>\n                    <h3 id=\"metric-sem-int\" class=\"text-xl font-extrabold text-red-600\">0<\/h3>\n                <\/div>\n            <\/div>\n            <div class=\"bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4\">\n                <div class=\"p-3 bg-amber-50 text-amber-600 rounded-xl text-xl font-bold\"><i class=\"fa-solid fa-mug-hot\"><\/i><\/div>\n                <div>\n                    <p class=\"text-xs text-slate-500 font-semibold\">No Intervalo<\/p>\n                    <h3 id=\"metric-no-int\" class=\"text-xl font-extrabold text-amber-600\">0<\/h3>\n                <\/div>\n            <\/div>\n            <div class=\"bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4\">\n                <div class=\"p-3 bg-emerald-50 text-emerald-600 rounded-xl text-xl font-bold\"><i class=\"fa-solid fa-circle-check\"><\/i><\/div>\n                <div>\n                    <p class=\"text-xs text-slate-500 font-semibold\">Já Retiraram<\/p>\n                    <h3 id=\"metric-ja-int\" class=\"text-xl font-extrabold text-emerald-600\">0<\/h3>\n                <\/div>\n            <\/div>\n            <div class=\"bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4\">\n                <div class=\"p-3 bg-purple-50 text-purple-600 rounded-xl text-xl font-bold\"><i class=\"fa-solid fa-list-check\"><\/i><\/div>\n                <div>\n                    <p class=\"text-xs text-slate-500 font-semibold\">Pendências<\/p>\n                    <h3 id=\"metric-pendencias\" class=\"text-xl font-extrabold text-purple-600\">0<\/h3>\n                <\/div>\n            <\/div>\n            <div class=\"bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4\">\n                <div class=\"p-3 bg-rose-50 text-rose-600 rounded-xl text-xl font-bold\"><i class=\"fa-solid fa-fire\"><\/i><\/div>\n                <div>\n                    <p class=\"text-xs text-slate-500 font-semibold\">Críticas / Abertas<\/p>\n                    <h3 id=\"metric-criticas\" class=\"text-xl font-extrabold text-rose-600\">0<\/h3>\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <!-- Filter & Parameters Bar -->\n        <div class=\"bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4\">\n            <div class=\"flex flex-wrap items-center gap-4\">\n                <div class=\"flex flex-col\">\n                    <label class=\"text-xs font-semibold text-slate-500 mb-1\">Data do Turno<\/label>\n                    <input type=\"date\" id=\"shift-date-input\" onchange=\"handleManualDateChange();\" class=\"bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none\">\n                <\/div>\n                <div class=\"flex flex-col\">\n                    <label class=\"text-xs font-semibold text-slate-500 mb-1\">Identificação / Horário do Turno<\/label>\n                    <div class=\"flex space-x-2\">\n                        <select id=\"shift-turn-select\" onchange=\"persistData()\" class=\"bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-2 font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none\">\n                            <option value=\"1º Turno\">1º Turno<\/option>\n                            <option value=\"2º Turno\">2º Turno<\/option>\n                            <option value=\"3º Turno\">3º Turno<\/option>\n                            <option value=\"Turno Administrativo\">Turno Administrativo<\/option>\n                            <option value=\"Personalizado\">Personalizado<\/option>\n                        <\/select>\n                        <input type=\"text\" id=\"shift-time-custom\" oninput=\"persistData()\" value=\"07:00 - 15:30\" placeholder=\"Ex: 07:00 - 15:30\" class=\"bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-2 w-36 font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none\">\n                    <\/div>\n                <\/div>\n                <div class=\"flex flex-col\">\n                    <label class=\"text-xs font-semibold text-slate-500 mb-1\">Operador Responsável<\/label>\n                    <input type=\"text\" id=\"main-operator\" oninput=\"persistData()\" placeholder=\"Nome do operador...\" class=\"bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-2 w-52 font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none\">\n                <\/div>\n            <\/div>\n            <div class=\"flex flex-col\">\n                <span class=\"text-xs font-bold text-slate-500 uppercase tracking-wider mb-1\">Filtrar Regiões (Clique para Ativar/Desativar):<\/span>\n                <div id=\"region-filters\" class=\"flex flex-wrap gap-2\">\n                    <!-- Dynamic region filters -->\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <!-- Spreadsheet Table: Equipes por Região -->\n        <div class=\"bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden\">\n            <div class=\"p-4 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2\">\n                <h2 class=\"text-base font-bold text-slate-800\"><i class=\"fa-solid fa-helmet-safety text-emerald-600 mr-2\"><\/i>Controle de Equipes e Atividades por Região<\/h2>\n                <div class=\"flex flex-wrap items-center gap-3 text-xs font-semibold\">\n                    <span class=\"text-slate-500\"><i class=\"fa-solid fa-circle-info mr-1 text-emerald-600\"><\/i>Altere os campos ou horários diretamente na tabela<\/span>\n                    <span class=\"hidden sm:inline text-slate-300\">|<\/span>\n                    <span class=\"flex items-center gap-1 text-slate-600\">🔴 Sem Intervalo<\/span>\n                    <span class=\"flex items-center gap-1 text-slate-600\">🟡 No Intervalo<\/span>\n                    <span class=\"flex items-center gap-1 text-slate-600\">🟢 Já Retirado Int.<\/span>\n                <\/div>\n            <\/div>\n\n            <div class=\"overflow-x-auto\">\n                <table class=\"w-full text-left border-collapse excel-table text-sm\" id=\"main-teams-table\">\n                    <thead>\n                        <tr class=\"bg-slate-100 text-slate-700 text-xs uppercase font-bold\">\n                            <th class=\"py-3 px-4 w-44\">Equipe / Código<\/th>\n                            <th class=\"py-3 px-4 w-56 text-center\">Turno (Início – Fim)<\/th>\n                            <th class=\"py-3 px-4\">Localidade / Descrição da Atividade<\/th>\n                            <th class=\"py-3 px-4 w-44 text-center\">Horário Intervalo<\/th>\n                            <th class=\"py-3 px-4 w-52 text-center\">Status Intervalo (automático)<\/th>\n                        <\/tr>\n                    <\/thead>\n                    <tbody id=\"teams-tbody\">\n                        <!-- Populated via JavaScript -->\n                    <\/tbody>\n                <\/table>\n            <\/div>\n        <\/div>\n\n        <!-- Spreadsheet Table: Pendências -->\n        <div class=\"bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden\">\n            <div class=\"p-4 bg-slate-900 text-white flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2\">\n                <h2 class=\"text-base font-bold flex items-center\"><i class=\"fa-solid fa-triangle-exclamation text-amber-400 mr-2\"><\/i>PENDÊNCIAS E OCORRÊNCIAS RELEVANTES<\/h2>\n                <div class=\"flex flex-wrap items-center gap-3\">\n                    <div class=\"flex flex-wrap items-center gap-3 text-xs font-semibold text-slate-200\">\n                        <span class=\"flex items-center gap-1\">🔴 Aberta<\/span>\n                        <span class=\"flex items-center gap-1\">🟡 Em Deslocamento<\/span>\n                        <span class=\"flex items-center gap-1\">🟢 Em execução<\/span>\n                        <span class=\"flex items-center gap-1\">⚫ Finalizada<\/span>\n                    <\/div>\n                    <button onclick=\"addPendingRow()\" class=\"bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow transition flex items-center space-x-1\">\n                        <i class=\"fa-solid fa-plus\"><\/i>\n                        <span>Adicionar Pendência<\/span>\n                    <\/button>\n                <\/div>\n            <\/div>\n\n            <div class=\"overflow-x-auto\">\n                <table class=\"w-full text-left border-collapse excel-table text-sm\" id=\"pendencias-table\">\n                    <thead>\n                        <tr class=\"bg-slate-100 text-slate-700 text-xs uppercase font-bold\">\n                            <th class=\"py-3 px-4 w-36\">Incidência<\/th>\n                            <th class=\"py-3 px-4 w-64\">Localidade<\/th>\n                            <th class=\"py-3 px-4\">Observação<\/th>\n                            <th class=\"py-3 px-4 w-48 text-center\">Status da Ocorrência<\/th>\n                            <th class=\"py-3 px-4 w-16 text-center\">Ação<\/th>\n                        <\/tr>\n                    <\/thead>\n                    <tbody id=\"pendencias-tbody\">\n                        <!-- Populated via JavaScript -->\n                    <\/tbody>\n                <\/table>\n            <\/div>\n        <\/div>\n\n    <\/main>\n\n    <!-- Config Modal (Cadastro e Edição de Equipes) -->\n    <div id=\"config-modal\" class=\"fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden\">\n        <div class=\"bg-white rounded-2xl shadow-2xl max-w-3xl w-full mx-4 overflow-hidden border border-slate-200\">\n            <div class=\"bg-slate-900 text-white px-6 py-4 flex items-center justify-between\">\n                <div class=\"flex items-center space-x-2\">\n                    <i class=\"fa-solid fa-gear text-emerald-400\"><\/i>\n                    <h3 class=\"font-bold text-lg\" id=\"modal-title-text\">Gerenciar Equipes e Cadastros<\/h3>\n                <\/div>\n                <button onclick=\"closeConfigModal()\" class=\"text-slate-400 hover:text-white transition\">\n                    <i class=\"fa-solid fa-xmark text-lg\"><\/i>\n                <\/button>\n            <\/div>\n\n            <div class=\"p-6 space-y-6\">\n                <!-- Add / Edit Team Form -->\n                <div class=\"bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-4\">\n                    <h4 class=\"text-sm font-bold text-slate-700\" id=\"form-team-title\">Cadastrar Nova Equipe / Código<\/h4>\n                    <input type=\"hidden\" id=\"edit-team-index\" value=\"-1\">\n                    <div class=\"grid grid-cols-1 md:grid-cols-3 gap-3\">\n                        <div>\n                            <label class=\"text-xs font-semibold text-slate-500 mb-1 block\">Região<\/label>\n                            <input type=\"text\" id=\"new-team-region\" placeholder=\"Ex: CRATEUS\" class=\"w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm uppercase focus:ring-2 focus:ring-emerald-500 focus:outline-none\">\n                        <\/div>\n                        <div>\n                            <label class=\"text-xs font-semibold text-slate-500 mb-1 block\">Código da Equipe<\/label>\n                            <input type=\"text\" id=\"new-team-code\" placeholder=\"Ex: CAT-RD-21D\" class=\"w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm uppercase focus:ring-2 focus:ring-emerald-500 focus:outline-none\">\n                        <\/div>\n                        <div>\n                            <label class=\"text-xs font-semibold text-slate-500 mb-1 block\">Atividade Padrão<\/label>\n                            <input type=\"text\" id=\"new-team-desc\" placeholder=\"Ex: CRATEUS / SEDE\" class=\"w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none\">\n                        <\/div>\n                    <\/div>\n                    <div class=\"flex justify-end space-x-2\">\n                        <button id=\"cancel-edit-btn\" onclick=\"resetTeamForm()\" class=\"hidden bg-slate-300 hover:bg-slate-400 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition\">\n                            Cancelar Edição\n                        <\/button>\n                        <button onclick=\"saveOrAddTeam()\" class=\"bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition flex items-center space-x-2\">\n                            <i class=\"fa-solid fa-plus\" id=\"form-action-icon\"><\/i>\n                            <span id=\"form-action-text\">Adicionar Equipe<\/span>\n                        <\/button>\n                    <\/div>\n                <\/div>\n\n                <!-- List of current teams -->\n                <div>\n                    <h4 class=\"text-sm font-bold text-slate-700 mb-2\">Equipes Cadastradas no Sistema<\/h4>\n                    <div class=\"max-h-60 overflow-y-auto border border-slate-200 rounded-xl bg-white\">\n                        <table class=\"w-full text-left border-collapse text-sm\">\n                            <thead class=\"bg-slate-100 text-xs text-slate-600 uppercase sticky top-0\">\n                                <tr>\n                                    <th class=\"py-2 px-3\">Região<\/th>\n                                    <th class=\"py-2 px-3\">Código<\/th>\n                                    <th class=\"py-2 px-3\">Descrição<\/th>\n                                    <th class=\"py-2 px-3 text-center w-24\">Ações<\/th>\n                                <\/tr>\n                            <\/thead>\n                            <tbody id=\"config-teams-tbody\" class=\"divide-y divide-slate-100\">\n                                <!-- Populated via JS -->\n                            <\/tbody>\n                        <\/table>\n                    <\/div>\n                <\/div>\n            <\/div>\n\n            <div class=\"bg-slate-50 px-6 py-3 border-t border-slate-200 flex justify-end\">\n                <button onclick=\"closeConfigModal()\" class=\"bg-slate-900 hover:bg-slate-800 text-white px-5 py-2 rounded-xl text-sm font-semibold transition\">\n                    Salvar e Fechar\n                <\/button>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <!-- WhatsApp Export Modal -->\n    <div id=\"whatsapp-modal\" class=\"fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden\">\n        <div class=\"bg-white rounded-2xl shadow-2xl max-w-2xl w-full mx-4 overflow-hidden border border-slate-200\">\n            <div class=\"bg-[#1ebea5] text-white px-6 py-4 flex items-center justify-between\">\n                <div class=\"flex items-center space-x-2\">\n                    <i class=\"fa-brands fa-whatsapp text-xl\"><\/i>\n                    <h3 class=\"font-bold text-lg\">Resumo para WhatsApp / Relatório Gerencial<\/h3>\n                <\/div>\n                <button onclick=\"closeWhatsappModal()\" class=\"text-white/80 hover:text-white transition\">\n                    <i class=\"fa-solid fa-xmark text-lg\"><\/i>\n                <\/button>\n            <\/div>\n\n            <div class=\"p-6 space-y-4\">\n                <p class=\"text-xs text-slate-500\">O texto abaixo foi formatado para envio direto no WhatsApp (negrito, emojis e espaçamento entre equipes):<\/p>\n                <textarea id=\"whatsapp-textarea\" rows=\"12\" class=\"w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs font-mono text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none\"><\/textarea>\n                <div class=\"flex justify-end space-x-3\">\n                    <button onclick=\"closeWhatsappModal()\" class=\"px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-bold transition\">\n                        Fechar\n                    <\/button>\n                    <button onclick=\"copyWhatsappText()\" class=\"px-5 py-2 bg-[#1ebea5] hover:bg-[#128c7e] text-white rounded-xl text-xs font-bold shadow transition flex items-center space-x-2\">\n                        <i class=\"fa-solid fa-copy\"><\/i>\n                        <span>Copiar Texto Formatado<\/span>\n                    <\/button>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <!-- Notification Toast -->\n    <div id=\"toast\" class=\"fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-sm flex items-center space-x-3 border border-slate-700\">\n        <i class=\"fa-solid fa-circle-check text-emerald-400 text-lg\"><\/i>\n        <span id=\"toast-message\">Operação realizada com sucesso!<\/span>\n    <\/div>\n\n    <footer class=\"text-center py-4 text-xs text-slate-500 mt-auto\">\n        Sistema Operacional de Passagem de Turno &copy; 2026 - Todos os direitos reservados.\n    <\/footer>\n\n    <script>\n        const defaultTeamsData = [];\n\n        // Escapa texto antes de colocá-lo no HTML (evita que aspas/< > quebrem os campos)\n        function esc(value) {\n            return String(value == null ? '' : value)\n                .replace(/&/g, '&amp;')\n                .replace(/<\/g, '&lt;')\n                .replace(/>/g, '&gt;')\n                .replace(/\"/g, '&quot;')\n                .replace(/'/g, '&#39;');\n        }\n\n        // Valor seguro para usar dentro de um atributo onclick/onchange com aspas simples\n        function jsArg(value) {\n            return encodeURIComponent(String(value)).replace(/'/g, '%27');\n        }\n\n        // Garante que equipes salvas antes da coluna de turno tenham os novos campos\n        function normalizeTeam(t) {\n            return {\n                ...t,\n                shiftStart: t.shiftStart || '',\n                shiftEnd: t.shiftEnd || '',\n                intervalTime: t.intervalTime || '',\n                interval: t.interval || 'Sem Intervalo'\n            };\n        }\n\n        function formatShift(t) {\n            if (t.shiftStart && t.shiftEnd) return `${t.shiftStart} – ${t.shiftEnd}`;\n            if (t.shiftStart) return `${t.shiftStart} – --:--`;\n            if (t.shiftEnd) return `--:-- – ${t.shiftEnd}`;\n            return '';\n        }\n\n        let defaultPendenciasData = [];\n\n        let teamsState = [];\n        let pendenciasState = [];\n        let activeRegions = {};\n        // Enquanto true, a data do turno segue o relógio automaticamente (inclusive virando à meia-noite).\n        // Vira false assim que o usuário escolhe uma data manualmente (ex: registrar um turno passado).\n        let autoDateTracking = true;\n\n        function getTodayStr() {\n            const now = new Date();\n            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;\n        }\n\n        function handleManualDateChange() {\n            autoDateTracking = (document.getElementById('shift-date-input').value === getTodayStr());\n            renderApp();\n            persistData();\n        }\n\n        function updateLiveClock() {\n            const now = new Date();\n            document.getElementById('current-time-display').textContent = now.toLocaleTimeString('pt-BR');\n            \n            const dateInput = document.getElementById('shift-date-input');\n            const todayStr = getTodayStr();\n            if (!dateInput.value) {\n                dateInput.value = todayStr;\n            } else if (autoDateTracking && dateInput.value !== todayStr) {\n                // Meia-noite passou com o navegador aberto: atualiza a data sozinha, sem precisar dar F5\n                dateInput.value = todayStr;\n                persistData();\n                showToast('Novo dia iniciado — data do turno atualizada automaticamente.');\n            }\n            document.getElementById('current-date-display').textContent = new Date(dateInput.value + 'T00:00:00').toLocaleDateString('pt-BR');\n\n            refreshIntervalStatuses();\n        }\n\n        function loadData() {\n            const savedTeams = localStorage.getItem('sheet_teams_data_v3');\n            const savedPendencias = localStorage.getItem('sheet_pendencias_data_v3');\n            const savedOperator = localStorage.getItem('sheet_operator_v3');\n            const savedTurn = localStorage.getItem('sheet_turn_v3');\n            const savedTurnTime = localStorage.getItem('sheet_turntime_v3');\n            const savedDate = localStorage.getItem('sheet_date_v3');\n\n            teamsState = savedTeams ? JSON.parse(savedTeams) : JSON.parse(JSON.stringify(defaultTeamsData));\n            pendenciasState = savedPendencias ? JSON.parse(savedPendencias) : JSON.parse(JSON.stringify(defaultPendenciasData));\n            teamsState = teamsState.map(normalizeTeam);\n            \n            if (savedOperator) document.getElementById('main-operator').value = savedOperator;\n            if (savedTurn) document.getElementById('shift-turn-select').value = savedTurn;\n            if (savedTurnTime) document.getElementById('shift-time-custom').value = savedTurnTime;\n\n            // A data do turno sempre começa no dia de hoje ao abrir o app.\n            // Só usamos a data salva se ela já for a de hoje (ex: você deu refresh na página no mesmo dia).\n            // Isso evita que, ao abrir o app num dia novo, ele volte colado na data do último uso.\n            const todayStr = getTodayStr();\n            document.getElementById('shift-date-input').value = (savedDate === todayStr) ? savedDate : todayStr;\n            autoDateTracking = true;\n\n            const regions = [...new Set(teamsState.map(t => t.region))];\n            regions.forEach(reg => {\n                if (activeRegions[reg] === undefined) activeRegions[reg] = true;\n            });\n        }\n\n        function persistData() {\n            localStorage.setItem('sheet_teams_data_v3', JSON.stringify(teamsState));\n            localStorage.setItem('sheet_pendencias_data_v3', JSON.stringify(pendenciasState));\n            localStorage.setItem('sheet_operator_v3', document.getElementById('main-operator').value);\n            localStorage.setItem('sheet_turn_v3', document.getElementById('shift-turn-select').value);\n            localStorage.setItem('sheet_turntime_v3', document.getElementById('shift-time-custom').value);\n            localStorage.setItem('sheet_date_v3', document.getElementById('shift-date-input').value);\n        }\n\n        function savePassagemState() {\n            persistData();\n            showToast('Passagem de turno salva com sucesso!');\n        }\n\n        function newPassagemConfirm() {\n            if (confirm('Iniciar uma nova passagem de turno?\\n\\nSerão limpos: descrição da atividade, horário/status do intervalo e todas as pendências.\\nSerão mantidos: equipes cadastradas, horários de turno, data, turno e operador.')) {\n                teamsState = teamsState.map(team => ({\n                    ...team,\n                    desc: '',\n                    intervalTime: '',\n                    interval: 'Sem Intervalo'\n                }));\n                pendenciasState = [];\n                persistData();\n                renderApp();\n                showToast('Nova passagem iniciada!');\n            }\n        }\n\n        function clearActivityFieldsConfirm() {\n            if (confirm('Isso vai limpar a Localidade/Descrição da Atividade, Horário e Status do Intervalo de todas as equipes, e apagar todas as pendências (Incidência, Localidade, Observação, Status e Ação). As equipes cadastradas, região, data, turno e operador serão mantidos. Deseja continuar?')) {\n                teamsState = teamsState.map(team => ({\n                    ...team,\n                    desc: '',\n                    intervalTime: '',\n                    interval: 'Sem Intervalo'\n                }));\n                pendenciasState = [];\n                persistData();\n                renderApp();\n                showToast('Campos de atividade e pendências limpos!');\n            }\n        }\n\n        function showToast(message) {\n            const toast = document.getElementById('toast');\n            document.getElementById('toast-message').textContent = message;\n            toast.classList.remove('translate-y-20', 'opacity-0');\n            setTimeout(() => {\n                toast.classList.add('translate-y-20', 'opacity-0');\n            }, 3000);\n        }\n\n        function renderApp() {\n            renderMetrics();\n            renderRegionFilters();\n            renderTeamsTable();\n            renderPendenciasTable();\n        }\n\n        function renderMetrics() {\n            const totalTeams = teamsState.length;\n            const semInt = teamsState.filter(t => t.interval === 'Sem Intervalo').length;\n            const noInt = teamsState.filter(t => t.interval === 'No Intervalo').length;\n            const jaInt = teamsState.filter(t => t.interval === 'Já Retirado Int.').length;\n            const totalPend = pendenciasState.length;\n            const criticas = pendenciasState.filter(p => p.status === '🔴 Aberta').length;\n\n            document.getElementById('metric-total-teams').textContent = totalTeams;\n            document.getElementById('metric-sem-int').textContent = semInt;\n            document.getElementById('metric-no-int').textContent = noInt;\n            document.getElementById('metric-ja-int').textContent = jaInt;\n            document.getElementById('metric-pendencias').textContent = totalPend;\n            document.getElementById('metric-criticas').textContent = criticas;\n        }\n\n        function renderRegionFilters() {\n            const container = document.getElementById('region-filters');\n            container.innerHTML = '';\n            const regions = [...new Set(teamsState.map(t => t.region))];\n\n            regions.forEach(reg => {\n                const isActive = activeRegions[reg] !== false;\n                const label = document.createElement('label');\n                label.className = `flex items-center space-x-1.5 px-3.5 py-1.5 rounded-xl text-xs font-bold cursor-pointer transition shadow-sm ${isActive ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`;\n                label.innerHTML = `\n                    <input type=\"checkbox\" ${isActive ? 'checked' : ''} onchange=\"toggleRegionFilter(decodeURIComponent('${jsArg(reg)}'))\" class=\"hidden\">\n                    <i class=\"fa-solid ${isActive ? 'fa-check' : 'fa-plus'} text-[10px]\"><\/i>\n                    <span>${esc(reg)}<\/span>\n                `;\n                container.appendChild(label);\n            });\n        }\n\n        function toggleRegionFilter(reg) {\n            activeRegions[reg] = !activeRegions[reg];\n            renderTeamsTable();\n            renderRegionFilters();\n        }\n\n        function renderTeamsTable() {\n            const tbody = document.getElementById('teams-tbody');\n            tbody.innerHTML = '';\n\n            const regions = [...new Set(teamsState.map(t => t.region))];\n\n            if (regions.length === 0) {\n                tbody.innerHTML = `\n                    <tr>\n                        <td colspan=\"5\" class=\"py-10 px-4 text-center text-slate-400 text-sm\">\n                            <i class=\"fa-solid fa-helmet-safety text-2xl mb-2 block\"><\/i>\n                            Nenhuma equipe cadastrada ainda.<br>\n                            Clique em <span class=\"font-semibold text-slate-600\">\"Configurar Equipes\"<\/span> para começar o cadastro.\n                        <\/td>\n                    <\/tr>\n                `;\n                renderMetrics();\n                return;\n            }\n\n            regions.forEach(reg => {\n                if (activeRegions[reg] === false) return;\n\n                const bannerTr = document.createElement('tr');\n                bannerTr.innerHTML = `\n                    <td colspan=\"5\" class=\"region-banner py-2.5 px-4 text-center text-xs tracking-wider\">\n                        <i class=\"fa-solid fa-location-dot mr-2 text-emerald-400\"><\/i>${esc(reg)}\n                    <\/td>\n                `;\n                tbody.appendChild(bannerTr);\n\n                const regionTeams = teamsState.filter(t => t.region === reg);\n                regionTeams.forEach(team => {\n                    const globalIndex = teamsState.findIndex(t => t.id === team.id);\n                    const tr = document.createElement('tr');\n                    tr.className = \"hover:bg-slate-50 transition data-row\";\n\n                    // Status do intervalo agora é calculado automaticamente a partir do horário informado\n                    team.interval = computeIntervalStatus(team.intervalTime);\n                    const badgeClasses = getIntervalBadgeClass(team.interval);\n\n                    tr.innerHTML = `\n                        <td class=\"py-4 px-4 font-mono font-bold text-slate-700 bg-slate-50/50\">\n                            ${esc(team.code)}\n                        <\/td>\n                        <td class=\"py-4 px-4 text-center\">\n                            <div class=\"flex items-center justify-center gap-1.5\">\n                                <input type=\"time\" value=\"${esc(team.shiftStart)}\" title=\"Início do turno\" oninput=\"updateTeamField(${globalIndex}, 'shiftStart', this.value)\" class=\"bg-slate-50 border border-slate-300 rounded-xl px-2 py-1 text-xs font-semibold focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                                <span class=\"text-slate-400 text-xs font-bold\">–<\/span>\n                                <input type=\"time\" value=\"${esc(team.shiftEnd)}\" title=\"Fim do turno\" oninput=\"updateTeamField(${globalIndex}, 'shiftEnd', this.value)\" class=\"bg-slate-50 border border-slate-300 rounded-xl px-2 py-1 text-xs font-semibold focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                            <\/div>\n                        <\/td>\n                        <td class=\"py-4 px-4\">\n                            <input type=\"text\" value=\"${esc(team.desc)}\" oninput=\"updateTeamField(${globalIndex}, 'desc', this.value)\" class=\"w-full bg-transparent border-0 focus:ring-1 focus:ring-emerald-500 rounded px-1 text-sm font-medium text-slate-800\">\n                        <\/td>\n                        <td class=\"py-4 px-4 text-center\">\n                            <input type=\"text\" value=\"${esc(team.intervalTime)}\" placeholder=\"Ex: 12:00 - 13:00\" oninput=\"updateTeamField(${globalIndex}, 'intervalTime', this.value)\" class=\"w-full text-center bg-slate-50 border border-slate-300 rounded-xl px-2 py-1 text-xs font-semibold focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                        <\/td>\n                        <td class=\"py-4 px-4 text-center\">\n                            <span id=\"interval-badge-${team.id}\" class=\"${badgeClasses}\">${team.interval}<\/span>\n                        <\/td>\n                    `;\n                    tbody.appendChild(tr);\n                });\n            });\n            renderMetrics();\n        }\n\n        // Interpreta um texto de horário tipo \"12:00 - 13:00\" e retorna os minutos de início/fim\n        function parseIntervalRange(str) {\n            if (!str) return null;\n            const match = String(str).match(/(\\d{1,2}):(\\d{2})\\s*(?:-|–|—|à|as|às)\\s*(\\d{1,2}):(\\d{2})/i);\n            if (!match) return null;\n            const startH = parseInt(match[1], 10);\n            const startM = parseInt(match[2], 10);\n            const endH = parseInt(match[3], 10);\n            const endM = parseInt(match[4], 10);\n            if (startH > 23 || endH > 23 || startM > 59 || endM > 59) return null;\n            return { start: startH * 60 + startM, end: endH * 60 + endM };\n        }\n\n        // Calcula automaticamente o status do intervalo com base na hora atual\n        function computeIntervalStatus(intervalTimeStr) {\n            const range = parseIntervalRange(intervalTimeStr);\n            if (!range) return 'Sem Intervalo';\n            const now = new Date();\n            const nowMin = now.getHours() * 60 + now.getMinutes();\n            const { start, end } = range;\n\n            if (end >= start) {\n                if (nowMin < start) return 'Sem Intervalo';\n                if (nowMin <= end) return 'No Intervalo';\n                return 'Já Retirado Int.';\n            }\n            // Intervalo que cruza a meia-noite (ex: 23:30 - 00:30)\n            if (nowMin >= start || nowMin <= end) return 'No Intervalo';\n            // Fora da janela: decide pelo lado mais próximo (logo depois do fim = já retirado;\n            // logo antes do início = ainda não retirado)\n            return (nowMin - end) < (start - nowMin) ? 'Já Retirado Int.' : 'Sem Intervalo';\n        }\n\n        function getIntervalBadgeClass(status) {\n            let colorClass = 'bg-white text-slate-700';\n            if (status === 'Sem Intervalo') colorClass = 'interval-sem';\n            else if (status === 'No Intervalo') colorClass = 'interval-no';\n            else if (status === 'Já Retirado Int.') colorClass = 'interval-ja';\n            return `w-full inline-block font-bold text-xs py-1.5 px-2 rounded-xl border border-slate-300 shadow-sm ${colorClass}`;\n        }\n\n        // Atualiza os status de intervalo de todas as equipes sem redesenhar a tabela inteira\n        // (evita perder o foco/cursor de quem está digitando)\n        function refreshIntervalStatuses() {\n            let changed = false;\n            teamsState.forEach(team => {\n                const newStatus = computeIntervalStatus(team.intervalTime);\n                if (team.interval !== newStatus) {\n                    team.interval = newStatus;\n                    changed = true;\n                }\n                const badge = document.getElementById(`interval-badge-${team.id}`);\n                if (badge) {\n                    badge.textContent = newStatus;\n                    badge.className = getIntervalBadgeClass(newStatus);\n                }\n            });\n            if (changed) {\n                persistData();\n                renderMetrics();\n            }\n        }\n\n        function updateTeamField(index, field, value) {\n            teamsState[index][field] = value;\n            if (field === 'intervalTime') {\n                refreshIntervalStatuses();\n            }\n            persistData();\n            if (field === 'interval') {\n                renderTeamsTable();\n            } else {\n                renderMetrics();\n            }\n        }\n\n        function renderPendenciasTable() {\n            const tbody = document.getElementById('pendencias-tbody');\n            tbody.innerHTML = '';\n\n            if (pendenciasState.length === 0) {\n                tbody.innerHTML = `\n                    <tr>\n                        <td colspan=\"5\" class=\"py-10 px-4 text-center text-slate-400 text-sm\">\n                            <i class=\"fa-solid fa-clipboard-check text-2xl mb-2 block\"><\/i>\n                            Nenhuma pendência registrada.<br>\n                            Clique em <span class=\"font-semibold text-slate-600\">\"Adicionar Pendência\"<\/span> para cadastrar.\n                        <\/td>\n                    <\/tr>\n                `;\n                renderMetrics();\n                return;\n            }\n\n            pendenciasState.forEach((item, index) => {\n                const tr = document.createElement('tr');\n                tr.className = \"hover:bg-slate-50 transition data-row\";\n                \n                let statusClass = 'status-aberta';\n                if (item.status === '🟡 Em Deslocamento') statusClass = 'status-deslocamento';\n                else if (item.status === '🟢 Em execução') statusClass = 'status-execucao';\n                else if (item.status === '⚫ finalizada') statusClass = 'status-finalizada';\n\n                tr.innerHTML = `\n                    <td class=\"py-4 px-4 align-top\">\n                        <input type=\"text\" value=\"${esc(item.incidencia)}\" oninput=\"updatePendenciaField(${index}, 'incidencia', this.value)\" class=\"w-full bg-slate-50 border border-slate-300 rounded-xl px-2 py-1 text-sm font-bold font-mono focus:ring-1 focus:ring-emerald-500 focus:outline-none\">\n                    <\/td>\n                    <td class=\"py-4 px-4 align-top\">\n                        <textarea rows=\"2\" oninput=\"updatePendenciaField(${index}, 'localidade', this.value)\" class=\"w-full bg-slate-50 border border-slate-300 rounded-xl px-2 py-1 text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none uppercase font-semibold\">${esc(item.localidade)}<\/textarea>\n                    <\/td>\n                    <td class=\"py-4 px-4 align-top\">\n                        <textarea rows=\"2\" oninput=\"updatePendenciaField(${index}, 'observacao', this.value)\" class=\"w-full bg-slate-50 border border-slate-300 rounded-xl px-2 py-1 text-sm focus:ring-1 focus:ring-emerald-500 focus:outline-none\">${esc(item.observacao)}<\/textarea>\n                    <\/td>\n                    <td class=\"py-4 px-4 text-center align-middle\">\n                        <select onchange=\"updatePendenciaField(${index}, 'status', this.value)\" class=\"w-full font-bold text-xs py-2 px-2 rounded-xl border shadow-sm ${statusClass}\">\n                            <option value=\"🔴 Aberta\" ${item.status === '🔴 Aberta' ? 'selected' : ''}>🔴 Aberta<\/option>\n                            <option value=\"🟡 Em Deslocamento\" ${item.status === '🟡 Em Deslocamento' ? 'selected' : ''}>🟡 Em Deslocamento<\/option>\n                            <option value=\"🟢 Em execução\" ${item.status === '🟢 Em execução' ? 'selected' : ''}>🟢 Em execução<\/option>\n                            <option value=\"⚫ finalizada\" ${item.status === '⚫ finalizada' ? 'selected' : ''}>⚫ finalizada<\/option>\n                        <\/select>\n                    <\/td>\n                    <td class=\"py-4 px-4 text-center align-middle\">\n                        <button onclick=\"removePendencia(${index})\" class=\"text-red-500 hover:text-red-700 p-2 rounded-xl hover:bg-red-50 transition\" title=\"Excluir pendência\">\n                            <i class=\"fa-solid fa-trash-can\"><\/i>\n                        <\/button>\n                    <\/td>\n                `;\n                tbody.appendChild(tr);\n            });\n            renderMetrics();\n        }\n\n        function updatePendenciaField(index, field, value) {\n            pendenciasState[index][field] = value;\n            persistData();\n            if (field === 'status') {\n                renderPendenciasTable();\n            } else {\n                renderMetrics();\n            }\n        }\n\n        function addPendingRow() {\n            pendenciasState.push({\n                id: Date.now(),\n                incidencia: '',\n                localidade: '',\n                observacao: '',\n                status: '🔴 Aberta'\n            });\n            persistData();\n            renderPendenciasTable();\n        }\n\n        function removePendencia(index) {\n            if (confirm('Tem certeza que deseja excluir esta pendência?')) {\n                pendenciasState.splice(index, 1);\n                persistData();\n                renderPendenciasTable();\n                showToast('Pendência removida.');\n            }\n        }\n\n        function openConfigModal() {\n            document.getElementById('config-modal').classList.remove('hidden');\n            resetTeamForm();\n            renderConfigTeamsList();\n        }\n\n        function closeConfigModal() {\n            document.getElementById('config-modal').classList.add('hidden');\n            renderApp();\n            showToast('Configurações atualizadas!');\n        }\n\n        function renderConfigTeamsList() {\n            const tbody = document.getElementById('config-teams-tbody');\n            tbody.innerHTML = '';\n\n            teamsState.forEach((team, index) => {\n                const tr = document.createElement('tr');\n                tr.className = \"hover:bg-slate-50 transition\";\n                tr.innerHTML = `\n                    <td class=\"py-2 px-3 font-bold text-emerald-700\">${esc(team.region)}<\/td>\n                    <td class=\"py-2 px-3 font-mono font-semibold\">${esc(team.code)}<\/td>\n                    <td class=\"py-2 px-3 text-slate-600\">${esc(team.desc)}<\/td>\n                    <td class=\"py-2 px-3 text-center flex justify-center space-x-1\">\n                        <button onclick=\"editTeam(${index})\" class=\"text-sky-600 hover:text-sky-800 p-1.5 rounded-xl hover:bg-sky-50 transition\" title=\"Editar equipe\">\n                            <i class=\"fa-solid fa-pen-to-square\"><\/i>\n                        <\/button>\n                        <button onclick=\"deleteConfigTeam(${index})\" class=\"text-red-400 hover:text-red-600 p-1.5 rounded-xl hover:bg-red-50 transition\" title=\"Remover equipe\">\n                            <i class=\"fa-solid fa-trash-can\"><\/i>\n                        <\/button>\n                    <\/td>\n                `;\n                tbody.appendChild(tr);\n            });\n        }\n\n        function saveOrAddTeam() {\n            const editIndex = parseInt(document.getElementById('edit-team-index').value);\n            const region = document.getElementById('new-team-region').value.trim().toUpperCase();\n            const code = document.getElementById('new-team-code').value.trim().toUpperCase();\n            const desc = document.getElementById('new-team-desc').value.trim().toUpperCase();\n\n            if (!region || !code) {\n                showToast('Preencha pelo menos a Região e o Código da Equipe.');\n                return;\n            }\n\n            // Anti-Duplicidade check\n            const alreadyExists = teamsState.some((t, i) => t.code === code && i !== editIndex);\n            if (alreadyExists) {\n                alert(`Erro: O código de equipe \"${code}\" já está cadastrado no sistema! Não é permitido duplicar códigos.`);\n                return;\n            }\n\n            if (editIndex === -1) {\n                teamsState.push({\n                    id: Date.now(),\n                    region: region,\n                    code: code,\n                    desc: desc || 'SEDE',\n                    shiftStart: '',\n                    shiftEnd: '',\n                    intervalTime: '',\n                    interval: 'Sem Intervalo'\n                });\n                showToast('Equipe cadastrada com sucesso!');\n            } else {\n                teamsState[editIndex].region = region;\n                teamsState[editIndex].code = code;\n                teamsState[editIndex].desc = desc;\n                showToast('Equipe atualizada com sucesso!');\n            }\n\n            persistData();\n            resetTeamForm();\n            renderConfigTeamsList();\n        }\n\n        function editTeam(index) {\n            const team = teamsState[index];\n            document.getElementById('edit-team-index').value = index;\n            document.getElementById('new-team-region').value = team.region;\n            document.getElementById('new-team-code').value = team.code;\n            document.getElementById('new-team-desc').value = team.desc;\n            \n            document.getElementById('form-team-title').textContent = `Editar Equipe: ${team.code}`;\n            document.getElementById('form-action-text').textContent = 'Salvar Alteração';\n            document.getElementById('form-action-icon').className = 'fa-solid fa-floppy-disk';\n            document.getElementById('cancel-edit-btn').classList.remove('hidden');\n        }\n\n        function resetTeamForm() {\n            document.getElementById('edit-team-index').value = '-1';\n            document.getElementById('new-team-region').value = '';\n            document.getElementById('new-team-code').value = '';\n            document.getElementById('new-team-desc').value = '';\n            \n            document.getElementById('form-team-title').textContent = 'Cadastrar Nova Equipe / Código';\n            document.getElementById('form-action-text').textContent = 'Adicionar Equipe';\n            document.getElementById('form-action-icon').className = 'fa-solid fa-plus';\n            document.getElementById('cancel-edit-btn').classList.add('hidden');\n        }\n\n        function deleteConfigTeam(index) {\n            if (confirm('Tem certeza que deseja excluir esta equipe do sistema?')) {\n                teamsState.splice(index, 1);\n                persistData();\n                renderConfigTeamsList();\n            }\n        }\n\n        function openWhatsappModal() {\n            const dateVal = document.getElementById('shift-date-input').value;\n            const formattedDate = dateVal ? new Date(dateVal + 'T00:00:00').toLocaleDateString('pt-BR') : '--/--/----';\n            const turnVal = document.getElementById('shift-turn-select').value;\n            const timeVal = document.getElementById('shift-time-custom').value;\n            const operator = document.getElementById('main-operator').value || 'Não informado';\n\n            const totalTeams = teamsState.length;\n            const semInt = teamsState.filter(t => t.interval === 'Sem Intervalo').length;\n            const noInt = teamsState.filter(t => t.interval === 'No Intervalo').length;\n            const jaInt = teamsState.filter(t => t.interval === 'Já Retirado Int.').length;\n            const totalPend = pendenciasState.length;\n            const criticas = pendenciasState.filter(p => p.status === '🔴 Aberta').length;\n\n            // Separador curto: não quebra de linha na tela do celular\n            const sep = '▬'.repeat(12);\n\n            // Textos digitados todo em MAIÚSCULAS ficam em caixa normal (siglas curtas são mantidas)\n            const smallWords = ['de','da','do','das','dos','na','no','nas','nos','e','a','o','em','um','uma','ao','para','com','por'];\n            const softCase = (txt) => {\n                const str = String(txt || '').trim();\n                if (!str || str !== str.toUpperCase() || str === str.toLowerCase()) return str;\n                return str.split(' ').map((w, i) => {\n                    const lw = w.toLowerCase();\n                    if (/\\d/.test(w)) return w;\n                    if (smallWords.includes(lw)) return i === 0 ? lw.charAt(0).toUpperCase() + lw.slice(1) : lw;\n                    if (w.replace(/[^A-Za-zÀ-ÿ]/g, '').length <= 3) return w;\n                    return lw.charAt(0).toUpperCase() + lw.slice(1);\n                }).join(' ');\n            };\n\n            let report = `📋 *PASSAGEM DE TURNO*\\n`;\n            report += `📅 ${formattedDate} | 🕐 ${turnVal} (${timeVal})\\n`;\n            report += `👤 Operador: *${operator}*\\n`;\n            report += `${sep}\\n\\n`;\n\n            report += `📊 *MÉTRICAS*\\n`;\n            report += `👥 ${totalTeams} equipes | 🔴 ${semInt} sem int. | 🟡 ${noInt} no int. | 🟢 ${jaInt} retiraram\\n`;\n            report += `📌 Pendências: ${totalPend} (${criticas} ${criticas === 1 ? 'crítica' : 'críticas'})\\n`;\n            report += `${sep}\\n\\n`;\n\n            const reportRegions = [...new Set(teamsState.map(t => t.region))];\n            if (reportRegions.length === 0) {\n                report += `Nenhuma equipe cadastrada.\\n\\n`;\n            }\n            reportRegions.forEach((reg) => {\n                report += `📍 *${reg.toUpperCase()}*\\n\\n`;\n                // Equipes sem intervalo (🔴) primeiro, depois no intervalo (🟡), depois as que já retiraram (🟢)\n                const order = { 'Sem Intervalo': 0, 'No Intervalo': 1, 'Já Retirado Int.': 2 };\n                const regionTeams = teamsState\n                    .filter(t => t.region === reg)\n                    .map((t, i) => ({ t, i }))\n                    .sort((a, b) => ((order[a.t.interval] ?? 0) - (order[b.t.interval] ?? 0)) || (a.i - b.i))\n                    .map(x => x.t);\n                regionTeams.forEach(t => {\n                    let emojiInt = '🔴';\n                    let intTxt;\n                    if (t.interval === 'No Intervalo') {\n                        emojiInt = '🟡';\n                        intTxt = `☕ ${t.intervalTime || 'horário não informado'} _(em intervalo)_`;\n                    } else if (t.interval === 'Já Retirado Int.') {\n                        emojiInt = '🟢';\n                        intTxt = `☕ ${t.intervalTime || 'horário não informado'} ✅`;\n                    } else {\n                        intTxt = t.intervalTime ? `☕ ${t.intervalTime} _(sem intervalo)_` : `☕ _sem intervalo_`;\n                    }\n                    const turnoTxt = formatShift(t).replace(/ – /g, '–');\n                    const linhaHora = [turnoTxt ? `🕒 ${turnoTxt}` : '', intTxt].filter(Boolean).join(' | ');\n                    report += `${emojiInt} *${t.code}*\\n`;\n                    report += `${softCase(t.desc) || '_Sem descrição_'}\\n`;\n                    report += `${linhaHora}\\n\\n`;\n                });\n                report += `${sep}\\n\\n`;\n            });\n\n            report += `⚠️ *PENDÊNCIAS*\\n\\n`;\n            if (pendenciasState.length === 0) {\n                report += `Nenhuma pendência registrada. ✅\\n`;\n            } else {\n                pendenciasState.forEach((p, idx) => {\n                    report += `${idx + 1}️⃣ *${p.incidencia || 'S/N'}* ${p.status}\\n`;\n                    report += `📍 ${softCase(p.localidade) || 'Não informado'}\\n`;\n                    report += `📝 ${softCase(p.observacao) || 'Sem observações'}\\n`;\n                    if (idx < pendenciasState.length - 1) report += `\\n`;\n                });\n            }\n\n            document.getElementById('whatsapp-textarea').value = report;\n            document.getElementById('whatsapp-modal').classList.remove('hidden');\n        }\n\n        function closeWhatsappModal() {\n            document.getElementById('whatsapp-modal').classList.add('hidden');\n        }\n\n        function copyWhatsappText() {\n            const textarea = document.getElementById('whatsapp-textarea');\n            const fallback = () => {\n                textarea.select();\n                document.execCommand('copy');\n                showToast('Texto copiado para a área de transferência!');\n            };\n            if (navigator.clipboard && navigator.clipboard.writeText) {\n                navigator.clipboard.writeText(textarea.value)\n                    .then(() => showToast('Texto copiado para a área de transferência!'))\n                    .catch(fallback);\n            } else {\n                fallback();\n            }\n        }\n\n        function exportToExcel() {\n            try {\n                const wb = XLSX.utils.book_new();\n\n                const dateVal = document.getElementById('shift-date-input').value;\n                const formattedDate = dateVal ? new Date(dateVal + 'T00:00:00').toLocaleDateString('pt-BR') : '--/--/----';\n                const turnVal = document.getElementById('shift-turn-select').value;\n                const timeVal = document.getElementById('shift-time-custom').value;\n                const operator = document.getElementById('main-operator').value || 'Não informado';\n\n                const teamsSheetData = [\n                    [\"PASSAGEM DE TURNO OPERACIONAL - RELATÓRIO GERENCIAL\"],\n                    [\"Data:\", formattedDate, \"Turno:\", `${turnVal} (${timeVal})`, \"Operador:\", operator],\n                    [],\n                    [\"CONTROLE DE EQUIPES E ATIVIDADES\"],\n                    [\"REGIÃO\", \"CÓDIGO DA EQUIPE\", \"TURNO (INÍCIO - FIM)\", \"DESCRIÇÃO / LOCALIDADE\", \"HORÁRIO INTERVALO\", \"STATUS INTERVALO\"]\n                ];\n\n                teamsState.forEach(t => {\n                    teamsSheetData.push([t.region, t.code, formatShift(t), t.desc, t.intervalTime, t.interval]);\n                });\n\n                teamsSheetData.push([]);\n                teamsSheetData.push([]);\n                teamsSheetData.push([\"PENDÊNCIAS E OCORRÊNCIAS RELEVANTES\"]);\n                teamsSheetData.push([\"INCIDÊNCIA\", \"LOCALIDADE\", \"OBSERVAÇÃO\", \"STATUS DA OCORRÊNCIA\"]);\n\n                pendenciasState.forEach(p => {\n                    teamsSheetData.push([p.incidencia, p.localidade, p.observacao, p.status]);\n                });\n\n                const ws = XLSX.utils.aoa_to_sheet(teamsSheetData);\n\n                // Styling adjustments for professional view\n                ws['!cols'] = [\n                    {wch: 22},\n                    {wch: 25},\n                    {wch: 22},\n                    {wch: 45},\n                    {wch: 20},\n                    {wch: 22}\n                ];\n\n                XLSX.utils.book_append_sheet(wb, ws, \"Passagem de Turno\");\n\n                const dateString = dateVal ? dateVal.replace(/-/g, '_') : 'relatorio';\n                XLSX.writeFile(wb, `passagem_de_turno_${dateString}.xlsx`);\n                \n                showToast(\"Planilha .xlsx exportada com sucesso!\");\n            } catch (error) {\n                console.error(error);\n                showToast(\"Erro ao exportar planilha.\");\n            }\n        }\n\n        function exportBackup() {\n            persistData();\n            const data = {\n                version: 3,\n                exportedAt: new Date().toISOString(),\n                teams: teamsState,\n                pendencias: pendenciasState,\n                operator: document.getElementById('main-operator').value,\n                turn: document.getElementById('shift-turn-select').value,\n                turnTime: document.getElementById('shift-time-custom').value,\n                date: document.getElementById('shift-date-input').value\n            };\n            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });\n            const url = URL.createObjectURL(blob);\n            const a = document.createElement('a');\n            a.href = url;\n            a.download = `backup_passagem_${getTodayStr().replace(/-/g, '_')}.json`;\n            document.body.appendChild(a);\n            a.click();\n            a.remove();\n            setTimeout(() => URL.revokeObjectURL(url), 1000);\n            showToast('Backup baixado com sucesso!');\n        }\n\n        function importBackup(input) {\n            const file = input.files && input.files[0];\n            if (!file) return;\n            const reader = new FileReader();\n            reader.onload = () => {\n                try {\n                    const d = JSON.parse(reader.result);\n                    if (!Array.isArray(d.teams) || !Array.isArray(d.pendencias)) throw new Error('formato inválido');\n                    if (!confirm('Restaurar este backup vai substituir os dados atuais. Deseja continuar?')) return;\n                    teamsState = d.teams.map(normalizeTeam);\n                    pendenciasState = d.pendencias;\n                    document.getElementById('main-operator').value = d.operator || '';\n                    if (d.turn) document.getElementById('shift-turn-select').value = d.turn;\n                    if (d.turnTime) document.getElementById('shift-time-custom').value = d.turnTime;\n                    activeRegions = {};\n                    teamsState.forEach(t => { activeRegions[t.region] = true; });\n                    persistData();\n                    renderApp();\n                    showToast('Backup restaurado com sucesso!');\n                } catch (err) {\n                    console.error(err);\n                    showToast('Arquivo de backup inválido.');\n                } finally {\n                    input.value = '';\n                }\n            };\n            reader.readAsText(file);\n        }\n\n        window.onload = function() {\n            loadData();\n            updateLiveClock();\n            setInterval(updateLiveClock, 1000);\n            renderApp();\n        };\n    <\/script>\n<\/body>\n<\/html>",b:"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Informe de Pendência — Segundo Recurso<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap\">\n<style>\n:root{--bg:#f3f5f8;--sf:#fff;--fi:#f7f9fb;--ink:#14202e;--mu:#5a6b7d;--ln:#d5dde6;--br:#1b4b8f;--brt:#fff;--ac:#e0a100;--dg:#b3261e;--ok:#17794d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){
